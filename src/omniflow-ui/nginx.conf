server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers on every served response. The app is fully self-contained
    # (no external fonts/CDNs), so a strict CSP holds — 'unsafe-inline' for styles
    # is the one concession AntD's runtime style injection needs; connect-src 'self'
    # covers the same-origin API and the SignalR WebSocket.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SPA fallback: unknown routes serve index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API traffic to the api service (mirrors the Vite dev proxy).
    location /api/     { proxy_pass http://api:8080; }
    location /connect/ { proxy_pass http://api:8080; }

    # SignalR hub needs WebSocket upgrade headers. A location-level proxy_set_header
    # disables inheritance of the server-level ones, so Host must be repeated here —
    # without it the API sees Host: api:8080 and rejects the token as "issuer not
    # valid" (the token's issuer is derived from the Host at login, i.e. $host).
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
