# WerkPilot (OmniFlow ESM) local stack.
#   docker compose up --build
#   UI  → http://localhost:5173   API → http://localhost:5226
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: OmniFlowDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI (guest/guest)
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/OmniFlow.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      #ConnectionStrings__DefaultConnection: "Server=ep-square-wildflower-a4k1t2f6-pooler.us-east-1.aws.neon.tech;Database=neondb;User Id=neondb_owner;Password=npg_I0S1fWmNETgo;Ssl Mode=Require;Trust Server Certificate=true;"
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=OmniFlowDb;Username=postgres;Password=postgres"
      Messaging__Transport: RabbitMq
      RabbitMq__Host: rabbitmq
      Email__Host: mailpit
      Email__Port: "1025"
      Email__UseStartTls: "false"
    ports:
      - "5226:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ui:
    build:
      context: src/omniflow-ui
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

  # ── Opt-in infrastructure (uncomment when needed) ──────────────────────
  # otel-collector:
  #   image: otel/opentelemetry-collector:latest
  #   command: ["--config=/etc/otel-collector.yaml"]
  #   volumes: ["./otel-collector.yaml:/etc/otel-collector.yaml"]
  #   ports: ["4317:4317"]

volumes:
  pgdata:
  rabbitmqdata:
