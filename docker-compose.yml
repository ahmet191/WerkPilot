# WerkPilot (OmniFlow ESM) local stack.
#   docker compose up --build
#   UI  → http://localhost:5173   API → http://localhost:5226
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: OmniFlowDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_ERLANG_COOKIE: "WerkPilotErlangCookieLongSecret2026"
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI (guest/guest)
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/OmniFlow.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=OmniFlowDb;Username=postgres;Password=postgres"
      Messaging__Transport: RabbitMq
      RabbitMq__Host: rabbitmq
      Email__Host: mailpit
      Email__Port: "1025"
      Email__UseStartTls: "false"
    ports:
      - "5226:8080"
    volumes:
      # Local storage provider writes here; the named volume keeps uploaded
      # attachments across container recreates. Switch to the S3 provider (see
      # the minio service below) to drop this dependency on a mounted disk.
      - uploads:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ui:
    build:
      context: src/omniflow-ui
      dockerfile: Dockerfile
    ports:
      - "5173:8080"   # unprivileged nginx listens on 8080 inside the container
    depends_on:
      - api

  # ── Opt-in: S3-compatible storage (docker compose --profile s3 up) ─────
  # Start this, then set the api service's Storage__* env to point at it:
  #   Storage__Provider: S3
  #   Storage__S3__ServiceUrl: http://minio:9000
  #   Storage__S3__AccessKey: minioadmin
  #   Storage__S3__SecretKey: minioadmin
  # The bucket is auto-created on first upload; attachments then live in the
  # miniodata volume instead of the api container's disk.
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Opt-in infrastructure (uncomment when needed) ──────────────────────
  # otel-collector:
  #   image: otel/opentelemetry-collector:latest
  #   command: ["--config=/etc/otel-collector.yaml"]
  #   volumes: ["./otel-collector.yaml:/etc/otel-collector.yaml"]
  #   ports: ["4317:4317"]

volumes:
  pgdata:
  rabbitmqdata:
  uploads:
  miniodata:
