name: Security

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    # Weekly re-scan so newly disclosed CVEs surface even without a push.
    - cron: "0 6 * * 1"

jobs:
  trivy:
    name: Trivy (deps + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          # Only fail on CVEs that actually have a fix available — an unfixable
          # transitive CVE shouldn't block every build.
          ignore-unfixed: true
          exit-code: "1"

  gitleaks:
    name: gitleaks (committed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      # Scan the tracked files at HEAD, exported without .git — so the result is
      # the current committed state only, never history or loose git objects
      # (which vary with checkout depth and produced non-deterministic results).
      # Secrets are handled at the history level separately; see SECURITY.md.
      - name: Scan committed files
        run: |
          mkdir -p _scan
          git archive --format=tar HEAD | tar -x -C _scan
          gitleaks dir _scan --redact --exit-code 1

  dependency-audit:
    name: Dependency audit (dotnet + npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: dotnet vulnerable packages
        run: |
          dotnet restore OmniFlow.slnx
          dotnet list OmniFlow.slnx package --vulnerable --include-transitive 2>&1 | tee dotnet-vuln.txt
          if grep -q "has the following vulnerable" dotnet-vuln.txt; then
            echo "::error::Vulnerable NuGet packages found"; exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/omniflow-ui/package-lock.json
      - name: npm audit
        working-directory: src/omniflow-ui
        run: |
          npm ci
          npm audit --audit-level=high
