name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore OmniFlow.slnx

      - name: Build
        run: dotnet build OmniFlow.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/OmniFlow.Application.UnitTests/OmniFlow.Application.UnitTests.csproj -c Release --no-build --verbosity normal

      # Integration tests spin up a disposable Postgres via Testcontainers.
      # ubuntu-latest ships a working Docker daemon, so no extra service is needed.
      - name: Integration tests
        run: dotnet test tests/OmniFlow.Api.IntegrationTests/OmniFlow.Api.IntegrationTests.csproj -c Release --no-build --verbosity normal

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/omniflow-ui
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/omniflow-ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check + build
        run: npm run build
