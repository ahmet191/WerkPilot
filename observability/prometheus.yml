global:
  scrape_interval: 15s

scrape_configs:
  # The API's OpenTelemetry Prometheus endpoint.
  - job_name: werkpilot-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]

  # The collector's own telemetry.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
